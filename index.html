<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoosterlyWork</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="auth-container">
    <h1>RoosterlyWork</h1>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <button onclick="register()">Register</button>
    <div id="auth-status" class="status-msg"></div>
</div>

<div id="app-container" style="display: none;">
    <nav>
        <button onclick="switchTab('schedule')">Schedule</button>
        <button onclick="switchTab('chat')">Chat</button>
        <button onclick="switchTab('hours')">Hours & Pay</button>
        <button onclick="switchTab('settings')">Settings</button>
        <button onclick="logout()" class="logout-btn">Logout</button>
    </nav>

    <div id="schedule-tab" class="tab-content">
        <h2>Company Schedule</h2>
        <div class="control-panel">
            <input type="text" id="shift-username" placeholder="Assign to Username">
            <input type="text" id="shift-day" placeholder="Day of the week">
            <input type="number" id="shift-hours" placeholder="Total Hours">
            <div class="checkbox-group">
                <input type="checkbox" id="shift-repeat">
                <label for="shift-repeat">Repeat Weekly</label>
            </div>
            <button onclick="assignShift()">Save Shift</button>
        </div>
        <div id="schedule-grid"></div>
    </div>

    <div id="chat-tab" class="tab-content" style="display: none;">
        <h2>Team Communication</h2>
        <div class="control-panel">
            <select id="chat-mode" onchange="togglePrivateMode()">
                <option value="public">Public Company Chat</option>
                <option value="private">Private Message</option>
            </select>
            <input type="text" id="chat-recipient" placeholder="Recipient Username" style="display: none;">
        </div>
        <div id="chat-feed"></div>
        <div class="chat-inputs">
            <input type="text" id="chat-message" placeholder="Type a message, link, or poll...">
            <input type="file" id="chat-media" accept="image/*,video/*">
            <button onclick="sendChatMessage()">Send</button>
        </div>
    </div>

    <div id="hours-tab" class="tab-content" style="display: none;">
        <h2>Hours & Earnings Tracker</h2>
        <div class="control-panel">
            <input type="number" id="hourly-rate" placeholder="Your Hourly Rate" value="15">
            <button onclick="calculateEarnings()">Calculate My Earnings</button>
        </div>
        <div id="earnings-display"></div>
    </div>

    <div id="settings-tab" class="tab-content" style="display: none;">
        <h2>Company Settings</h2>
        <div class="control-panel">
            <input type="text" id="new-member-username" placeholder="Colleague Username">
            <button onclick="addRoomMember()">Add User to Company Planner</button>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
